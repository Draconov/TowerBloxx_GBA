name: GBA ROM CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host parity tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install host test dependencies
        run: python -m pip install --upgrade pytest Pillow

      - name: Run parity suite
        run: python -m pytest -q

  gba-build:
    name: Build GBA ROM
    needs: host-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitARM tools
        run: |
          command -v arm-none-eabi-g++
          command -v grit
          arm-none-eabi-g++ --version
          python3 --version

      - name: Fetch Butano 21.7.1
        run: |
          rm -rf .ci/butano
          git clone --depth 1 --branch 21.7.1 https://github.com/GValiente/butano.git .ci/butano
          test -f .ci/butano/butano/butano.mak

      - name: Build Tower Bloxx GBA
        run: |
          make -C gba -j2 LIBBUTANO="$GITHUB_WORKSPACE/.ci/butano/butano"
          test -s gba/TowerBloxxGBA.gba

      - name: Package release ROM
        run: scripts/ci/package_rom.sh "$GITHUB_WORKSPACE"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerBloxx-GBA-${{ github.sha }}
          path: |
            dist/TowerBloxx.gba
            dist/TowerBloxx.gba.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, gba-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified ROM artifact
        uses: actions/download-artifact@v4
        with:
          name: TowerBloxx-GBA-${{ github.sha }}
          path: dist

      - name: Verify release checksum
        working-directory: dist
        run: sha256sum --check TowerBloxx.gba.sha256

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/TowerBloxx.gba \
              dist/TowerBloxx.gba.sha256 \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/TowerBloxx.gba \
              dist/TowerBloxx.gba.sha256 \
              --verify-tag \
              --title "Tower Bloxx GBA ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
