name: GBA ROM CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.0 or v0.1.0). Leave blank for build only."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install host test dependencies
        run: python -m pip install --upgrade pytest Pillow

      - name: Run permanent regression suite
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q

  gba-build:
    name: Build GBA ROM
    needs: host-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure devkitARM PATH
        run: |
          test -d "$DEVKITARM/bin"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"

      - name: Verify devkitARM tools
        run: |
          command -v arm-none-eabi-g++
          command -v grit
          arm-none-eabi-g++ --version
          python3 --version

      - name: Fetch Butano 21.7.1
        run: |
          rm -rf .ci/butano
          git clone --depth 1 --branch 21.7.1 https://github.com/GValiente/butano.git .ci/butano
          test -f .ci/butano/butano/butano.mak

      - name: Build Tower Bloxx GBA
        run: |
          make -C gba -j2 LIBBUTANO="$GITHUB_WORKSPACE/.ci/butano/butano"
          test -s gba/TowerBloxxGBA.gba

      - name: Package release ROM
        run: bash scripts/ci/package_rom.sh "$GITHUB_WORKSPACE"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerBloxx-GBA-${{ github.sha }}
          path: |
            dist/TowerBloxx.gba
            dist/TowerBloxx.gba.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [host-tests, gba-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release_meta
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${RELEASE_VERSION}"
            if [[ "${release_tag}" != v* ]]; then
              release_tag="v${release_tag}"
            fi
            if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: version must look like 0.1.0 or v0.1.0" >&2
              exit 1
            fi
          else
            release_tag="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Download verified ROM artifact
        uses: actions/download-artifact@v4
        with:
          name: TowerBloxx-GBA-${{ github.sha }}
          path: dist

      - name: Verify release checksum
        working-directory: dist
        run: sha256sum --check TowerBloxx.gba.sha256

      - name: Point manual release tag at this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        run: |
          git fetch --tags --force
          git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/TowerBloxx.gba \
              dist/TowerBloxx.gba.sha256 \
              --clobber
            gh release edit "${RELEASE_TAG}" \
              --title "Tower Bloxx GBA ${RELEASE_TAG}"
          else
            gh release create "${RELEASE_TAG}" \
              dist/TowerBloxx.gba \
              dist/TowerBloxx.gba.sha256 \
              --verify-tag \
              --title "Tower Bloxx GBA ${RELEASE_TAG}" \
              --generate-notes
          fi
